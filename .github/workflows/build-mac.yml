# 邮件助手 macOS 构建工作流
# 用途：在 GitHub 托管的 macOS Runner 上用 PyInstaller 生成 邮件助手.app，并作为 Release 资产上传。
# 触发：推送 v* 标签或手动运行（workflow_dispatch）。
#
# 安全文件来源说明（避免 single secret 超过 48KB 上限）：
#   - app_icon.icns（约 1.8MB）：随仓库跟踪于 assets/icon/app_icon.icns，不占用 secret。
#   - cred_app.c（约 344KB）：AES-256-CBC 加密为 src/crypto/cred_app.c.enc 随仓库跟踪；
#     解密密钥以 hex 形式放 CRED_FILE_KEY secret，CI 内用 openssl 现场解密还原。
#   - setup_crypt.py（编译脚本，无密钥）：随仓库跟踪于 src/security/setup_crypt.py。
#   - 仍需在仓库 Settings -> Secrets -> Actions 配置（缺哪个，哪块能力就缺失）：
#       CREDENTIALS_ENC      -> base64 的 credentials.enc（必须，否则程序无 SMTP 凭据）
#       CRED_FILE_KEY        -> hex 的 AES 解密密钥（必须，用于现场解密 cred_app.c）
# 若必要秘密未配置，生成的 .app 功能不完整，仅适合验证打包流程。
name: build-mac

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-mac-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 提供加密安全类文件
        shell: bash
        env:
          CREDENTIALS_ENC: ${{ secrets.CREDENTIALS_ENC }}
          CRED_FILE_KEY: ${{ secrets.CRED_FILE_KEY }}
        run: |
          SEC=src/security
          mkdir -p "$SEC"
          # 1) 用仓库内加密的 C 源码 + secret 密钥现场解密出 cred_app.c
          [ -n "$CRED_FILE_KEY" ] && openssl enc -d -aes-256-cbc \
            -K "$CRED_FILE_KEY" -iv "000102030405060708090a0b0c0d0e0f" \
            -in src/crypto/cred_app.c.enc -out "$SEC/cred_app.c" \
            && echo "已还原 cred_app.c"
          # 2) SMTP 密文（来自 secret）
          [ -n "$CREDENTIALS_ENC" ] && echo "$CREDENTIALS_ENC" | base64 -d > "$SEC/credentials.enc"
          # 3) setup_crypt.py 已随仓库跟踪于 src/security/，无需 secret
          echo "已按 secrets 恢复安全文件（缺失项将被跳过）"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller"

      - name: 编译密钥 C 扩展
        run: |
          cd src/security
          python setup_crypt.py build_ext --inplace

      - name: PyInstaller 打包 .app
        run: pyinstaller --noconfirm --clean 邮件助手_mac.spec

      - name: 生成压缩包（便于上传）
        run: |
          cd dist
          ditto -c -k --sequesterRsrc "邮件助手.app" "EmailHelper-mac.app.zip"

      - name: 上传 .app 压缩包到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmailHelper-mac.app.zip
          tag_name: ${{ github.ref_name }}
          overwrite: true